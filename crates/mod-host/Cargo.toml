[package]
name = "me3-mod-host"
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Host DLL providing game extension functionality"
publish = false

[features]
default = []
sentry = ["me3-telemetry/sentry"]

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22.1"
closure-ffi = { version = "5.1", features = ["coverage", "std"] }
color-eyre.workspace = true
dearxan = "0.5.5"
diversion = { version = "0.2.2", features = ["custom"] }
eyre = { workspace = true, default-features = false, features = ["track-caller"] }
from-singleton.workspace = true
indexmap.workspace = true
libloading = "0.9.0"
libmimalloc-sys = { git = "https://github.com/Dasaav-dsv/mimalloc_rust.git", tag = "v0.1.49-mimalloc-v3.4.1", features = [
    "extended",
    "arena",
] }
me3-binary-analysis.workspace = true
me3-env.workspace = true
me3-ipc.workspace = true
me3-launcher-attach-protocol.workspace = true
me3-mod-host-assets.workspace = true
me3-mod-host-types.workspace = true
me3-mod-protocol.workspace = true
me3-telemetry.workspace = true
memchr.workspace = true
miniz_oxide = { version = "0.9.0", features = ["std"] }
pelite.workspace = true
pkcs1 = { version = "0.7.5", features = ["std"] }
rayon.workspace = true
rdvec.workspace = true
regex.workspace = true
seq-macro = "0.3.6"
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
windows = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
xxhash-rust.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
